<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">

  <!-- 背景 -->
  <!-- <rect width="32" height="32" fill="#000"/> -->

  <!-- 円（白縁） -->
  <circle
    cx="16" cy="16" r="11"
    fill="none"
    stroke="#fff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-dasharray="44 16"
    transform="rotate(45 16 16)"
  />

  <!-- 円（本体） -->
  <circle
    cx="16" cy="16" r="11"
    fill="none"
    stroke="#051a3f"
    stroke-width="4"
    stroke-linecap="round"
    stroke-dasharray="44 16"
    transform="rotate(45 16 16)"
  />

  <!-- 点（白縁） -->
  <circle cx="24" cy="8.5" r="3.6" fill="#fff"/>

  <!-- 点（本体） -->
  <circle cx="24" cy="8.5" r="3" fill="#089A8C"/>

</svg>