<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">

  <!-- 背景 -->
  <rect width="32" height="32" fill="#000"/>

  <!-- 円（白縁） -->
  <circle
    cx="16" cy="16" r="11"
    fill="none"
    stroke="#fff"
    stroke-width="8"
    stroke-linecap="round"
    stroke-dasharray="35 26"
    transform="rotate(45 16 16)"
  />

  <!-- 円（本体） -->
  <circle
    cx="16" cy="16" r="11"
    fill="none"
    stroke="#0F2A44"
    stroke-width="6"
    stroke-linecap="round"
    stroke-dasharray="35 26"
    transform="rotate(45 16 16)"
  />

  <!-- 点（白縁） -->
  <circle cx="23" cy="9" r="7" fill="#fff"/>

  <!-- 点（本体） -->
  <circle cx="23" cy="9" r="5" fill="#00BFA6"/>

</svg>